<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Convert &amp; calculate · Ripple</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ripple">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="tools">
  <div class="liquid-bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <nav class="nav" id="nav"></nav>

  <main class="shell">
    <header class="page-head">
      <span class="eyebrow">Quick maths</span>
      <h1>Convert &amp; calculate</h1>
      <p>Switch units or run the numbers. Both work fully offline.</p>
    </header>

    <div class="seg" id="toolsMode" style="margin-bottom:20px">
      <button class="active" data-mode="convert">Convert</button>
      <button data-mode="calc">Calculate</button>
    </div>

    <!-- CONVERT -->
    <section class="card" id="convertView">
      <div class="cat-tabs" id="catTabs"></div>

      <div class="conv-grid">
        <div class="conv-cell">
          <label for="fromVal">From</label>
          <input class="field" id="fromVal" type="number" inputmode="decimal" placeholder="0">
          <select class="field" id="fromUnit" style="margin-top:10px"></select>
        </div>

        <button class="swap-btn" id="swapBtn" aria-label="Swap units">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13M7 4L4 7M7 4l3 3M17 20V7M17 20l3-3M17 20l-3-3"/></svg>
        </button>

        <div class="conv-cell">
          <label for="toVal">To</label>
          <input class="field" id="toVal" type="number" placeholder="0" readonly>
          <select class="field" id="toUnit" style="margin-top:10px"></select>
        </div>
      </div>

      <div class="conv-result" id="convResult" style="display:none"></div>
    </section>

    <!-- CALCULATE -->
    <section class="card calc-card" id="calcView" hidden>
      <div class="calc-display">
        <div class="calc-expr" id="calcExpr">0</div>
        <div class="calc-preview" id="calcPreview"></div>
      </div>
      <div class="calc-keys" id="calcKeys"></div>
    </section>
  </main>
</body>
</html>
